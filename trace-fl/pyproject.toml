[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-fl"
version = "0.1.0"
description = "TRACE-FL Phase 1 - Federated Learning Infrastructure"
authors = [
    { name = "Sentinels", email = "sentinel@example.com" }
]
requires-python = "==3.11.14"
dependencies = [
    "flwr[simulation]>=1.15.2",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0,<2.0.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.flwr.app]
publisher = "sentinels"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "federation", "data", "training", "telemetry", "attacks"]

[tool.flwr.app.components]
serverapp = "app.server_app:app"
clientapp = "app.client_app:app"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
